# Pubblicazione di Open2Bill sotto https://<host>/open2bill/.
#
# Non è un `server` a sé: va incluso nel server block 443 già esistente
# (es. `include /etc/nginx/apps-enabled/*.conf;`).
#
# Installazione: /etc/nginx/apps-enabled/open2bill.conf (vedi deploy/setup-nginx.sh)

# Senza barra finale il browser risolverebbe gli asset sulla radice del server.
location = /open2bill {
  return 301 /open2bill/;
}

location /open2bill/ {
  # La barra finale toglie il prefisso: il container riceve /api/... e /assets/... sulla radice.
  proxy_pass http://127.0.0.1:8086/;

  proxy_http_version 1.1;
  # `$http_host` e non `$host`: il server confronta l'host di Origin con Host per respingere
  # le richieste da altri siti, e `$host` perde la porta (es. accesso da una porta non 443).
  proxy_set_header Host              $http_host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # il server accetta documenti fino a 5 MB (logo compreso)
  client_max_body_size 6m;

  proxy_connect_timeout 5s;
  # il primo PDF avvia Chromium nel container
  proxy_read_timeout    120s;
}
